[package]
name = "omarchy-sysinfo"
version = "0.1.0"
edition = "2024"
# `<[T]>::as_chunks` (efivar decoding) is the newest std API in use.
rust-version = "1.88"
description = "A TUI that describes this machine: hardware, OS, boot and Omarchy state"
license = "MIT"
repository = "https://github.com/gosumarchy/omarchy-sysinfo"

# No dependencies. Everything here is std-only: the renderer, the keyboard
# decoder, the /proc and /sys parsers, and the theme reader.
[dependencies]

[[bin]]
name = "omarchy-sysinfo"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
